<g transform="translate(480.0 46) scale(0.42)"><path d="M0 -7 L 2.6 -8 L 5.2 -21 L 7.4 -6 C 15 -12 27 -22 40 -22 C 48 -22 55 -17 60 -9 C 54 -9 50.5 -5 49 5 C 44.5 -1 38.5 0 36 11 C 31 5 25 7 23 17 C 17 15 8.5 19 0 33 C -8.5 19 -17 15 -23 17 C -25 7 -31 5 -36 11 C -38.5 0 -44.5 -1 -49 5 C -50.5 -5 -54 -9 -60 -9 C -55 -17 -48 -22 -40 -22 C -27 -22 -15 -12 -7.4 -6 L -5.2 -21 L -2.6 -8 L 0 -7 Z" fill="#FFE81F"/></g>
